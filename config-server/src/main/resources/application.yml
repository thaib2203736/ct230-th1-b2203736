server:
  port: 8888

spring:
  application:
    name: config-server
  profiles:
    active: native
  cloud:
    config:
      server:
        native:
          # Mặc định đọc kho cấu hình đóng gói trong jar; ghi đè bằng CONFIG_REPO=file:/config-repo
          search-locations: ${CONFIG_REPO:classpath:/config-repo}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
