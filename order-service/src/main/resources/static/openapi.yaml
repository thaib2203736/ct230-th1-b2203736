openapi: 3.1.0
info:
  title: BookStore Order API
  version: 1.0.0
  description: |
    API đặt hàng. POST nên kèm Idempotency-Key để gửi lại an toàn khi mạng chập chờn.
    TH3: đơn được tạo ở trạng thái PENDING (giá lấy đồng bộ từ catalog-service, có cầu dao).
    TH4: customerId lấy từ JWT (thuộc tính customer_id), không lấy từ thân yêu cầu.
    TH5: trạng thái chuyển PENDING → STOCK_RESERVED hoặc CANCELLED qua Saga.
servers:
  - url: http://localhost:8080
    description: Qua api-gateway
  - url: http://localhost:8082
    description: Gọi thẳng order-service
paths:
  /api/v1/orders:
    post:
      operationId: placeOrder
      parameters:
        - name: Idempotency-Key
          in: header
          required: false
          schema: { type: string, maxLength: 100 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateOrderRequest' }
            example:
              customerId: 88
              lines:
                - { isbn: '9780134685991', quantity: 1 }
                - { isbn: '9781617294549', quantity: 2 }
      responses:
        '201':
          description: Đã tạo (hoặc trả lại đơn cũ khi trùng Idempotency-Key, header Idempotent-Replayed=true)
          headers:
            Location: { schema: { type: string } }
            Idempotent-Replayed: { schema: { type: boolean } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Order' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { description: Thiếu hoặc sai access token (TH4) }
        '403': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
        '503':
          description: catalog-service không sẵn sàng (type upstream-unavailable), có Retry-After
          headers:
            Retry-After: { schema: { type: integer } }
          content:
            application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } }
    get:
      operationId: listOrders
      parameters:
        - name: customerId
          in: query
          schema: { type: integer, format: int64 }
      responses:
        '200':
          description: Danh sách đơn
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Order' }
  /api/v1/orders/{id}:
    get:
      operationId: getOrder
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer, format: int64 }
      responses:
        '200':
          description: Đơn hàng
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Order' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
components:
  responses:
    Problem:
      description: Lỗi RFC 9457
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
  schemas:
    Money:
      type: object
      required: [amount, currency]
      properties:
        amount: { type: number, minimum: 0 }
        currency: { type: string, enum: [VND, USD] }
    CreateOrderRequest:
      type: object
      required: [lines]
      properties:
        customerId: { type: integer, format: int64, description: Chỉ dùng ở TH3 }
        lines:
          type: array
          minItems: 1
          maxItems: 20
          items:
            type: object
            required: [isbn, quantity]
            properties:
              isbn: { type: string, pattern: '^97[89][0-9]{10}$' }
              quantity: { type: integer, minimum: 1, maximum: 100 }
    Order:
      type: object
      properties:
        id: { type: integer, format: int64, examples: [1001] }
        orderNumber: { type: string, pattern: '^ORD-[0-9]{4}-[0-9]{6}$', examples: ['ORD-2026-001001'] }
        customerId: { type: integer, format: int64 }
        status: { type: string, enum: [PENDING, STOCK_RESERVED, PAID, CONFIRMED, CANCELLED] }
        total: { $ref: '#/components/schemas/Money' }
        createdAt: { type: string, format: date-time }
        lines:
          type: array
          items:
            type: object
            properties:
              isbn: { type: string }
              quantity: { type: integer }
              unitPrice: { $ref: '#/components/schemas/Money' }
    Problem:
      type: object
      properties:
        type: { type: string, format: uri }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        instance: { type: string }
